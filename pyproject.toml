# Two ways to run adt and idt: the Claude Code plugin calls scripts/adt.py and scripts/idt.py through
# `uv run --script` (inline PEP 723 metadata there), and other agents use the `adt` and `idt` commands from
# `uv tool install`, built from here.
# Keep the dependencies in both places in sync.
[project]
name = "mobile-tester"
version = "0.3.0"
description = "adt and idt: the Android and iOS device tools behind the mobile-tester agent skills"
requires-python = ">=3.11"
dependencies = ["pillow>=11", "pyyaml>=6"]

[project.scripts]
adt = "mobiletester.android.cli:main"
idt = "mobiletester.ios.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/mobiletester"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The dashboard page is one HTML/CSS/JS string: its long lines are markup, not code.
"scripts/mobiletester/core/dashboard_page.py" = ["E501"]
