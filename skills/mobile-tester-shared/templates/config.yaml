# mobile-tester project configuration, shared by android-native-tester and ios-native-tester.
# Written by onboarding; safe to edit by hand. Lives in <project>/.mobile-tester/config.yaml.
version: 1

tester:
  name: ""
  team: ""

reports:
  dir: reports
  language: en
  default_time_box_min: 30

jira:
  project_key: ""           # e.g. PROJ
  base_url: ""              # e.g. https://yourcompany.atlassian.net
  # Bug drafts are written as Markdown. Issues are created only after explicit approval, one by one.

severity_notes: ""          # team additions to the standard severity scale, if any

# Devices are saved per user, for every project, with `adt devices --save` / `idt devices --save`
# (~/.config/mobile-tester/devices.yaml). A `devices:` list here still works for older projects.

autopilot:
  enabled: true             # after the session plan's Go, no questions until the wrap-up (see autopilot.md)
  decisions: {}             # only what differs from the defaults in autopilot.md

telemetry: false            # record time, tokens and activity per run (also offered in each session plan)
dashboard: true             # a live page of each session on 127.0.0.1 (screen, actions, findings, Pause and Stop)
