# App profile: <project>/.mobile-tester/apps/<package or bundle id>/profile.yaml
platform: Android             # Android | iOS
package: com.example.app      # Android package name or iOS bundle id
name: <App name>
store_url: ""                 # e.g. https://play.google.com/store/apps/details?id=com.example.app
expected_signer_sha256: ""    # Android: builds signed by another key are not installed without asking

# What the app is and how it works, in the user's own words.
# Every session reads this first: test ideas, expected behaviour and severity come from here and from
# the ticket, not from what apps of some other kind usually do.
about:
  description: |
    <What the app is for and what a user achieves with it, as long as it needs to be.
    Paste product docs or a link if that's easier.>
  users: ""                   # who uses it, in which situations, on which devices
  main_flows: []              # the journeys that matter most, in the app's own terms
  rules: []                   # how the app is supposed to behave: limits, validation, permissions, what persists
  roles: []                   # account types or permission levels, if any
  integrations: []            # other apps, services or hardware it depends on (camera, maps, payment provider, ...)
  not_in_scope: []            # areas that exist but must not be tested, and why
  glossary: {}                # app or domain terms and what they mean, e.g. {"<term>": "<meaning>"}

login:
  method: guest               # guest | secrets | manual | hook
  # secrets: credentials in secrets.local.yaml (gitignored, filled in by the user)
  # hook:    hooks/login.py logs in using secrets.local.yaml

# How to get back to a known start state: before the session, before every reproduction attempt,
# before each test case and before each known issue in a retest.
reset:
  strategy: restart           # restart | clear-data | hook | none
  # restart:    `dt app reset --level restart`: stop and relaunch; data, login and settings stay
  # clear-data: `dt app reset --level clear-data`: like a fresh install (onboarding, login and permission
  #             prompts again; iOS reinstalls the .app idt installed last); on a personal device it asks
  #             first, once per session
  # hook:       hooks.reset removes what tests leave behind (e.g. empties a list) and keeps the login
  # none:       never reset; the tester prepares the state by hand
  after: []                   # what to do after a reset, in plain words, e.g. ["skip the intro screens"]
                              # login runs again after clear-data, as `login` says

hooks:                        # scripts in hooks/, run by name with `dt hook <name> --package <package>` (dt: adt or idt)
  setup: ""                   # before the session, e.g. "setup"
  reset: ""                   # used when reset.strategy is hook, e.g. "reset"
  teardown: ""                # after the session

checks: []                    # scripts in checks/, e.g. ["logcat-errors"] (Android), run at wrap-up

risky_areas: []               # e.g. [account settings, data deletion]: extra caution and guardrails

# What a test must never do in this app, on top of the standard never-done list in autopilot.md.
forbidden: []                 # e.g. ["place an order", "send a message to a seller"]
# What is normally never done but is fine in this app, for every session.
grants: []                    # e.g. ["log out and back in"]

# Problems noticed outside the session's charter (another screen, an unrelated feature).
outside_scope:
  report: true                # true: listed in their own report section, not counted as bugs; false: ignored
  not_ready: []               # screens or features still being built: never reported, even when broken
                              # e.g. ["Settings > Beta features", "new onboarding flow"]
