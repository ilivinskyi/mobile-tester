# mobile-tester project configuration, shared by android-native-tester and ios-native-tester.
# Written by onboarding; safe to edit by hand. Lives in <project>/.mobile-tester/config.yaml.
version: 1

tester:
  name: ""
  team: ""

reports:
  dir: reports
  language: en
  default_time_box_min: 30

jira:
  project_key: ""           # e.g. PROJ
  base_url: ""              # e.g. https://yourcompany.atlassian.net
  # Bug drafts are written as Markdown. Issues are created only after explicit approval, one by one.

severity_notes: ""          # team additions to the standard severity scale, if any

devices:
  - id: ""                  # Android serial (`adt devices`) or iOS simulator or device UDID (`idt devices`)
    platform: Android       # Android | iOS
    name: ""                # e.g. "Test phone 1", "iPhone 17 simulator"
    kind: physical          # physical | emulator | simulator
    personal: true          # stricter guardrails: no system settings, data clearing or installs without asking
    navigation: gesture     # from `adt info` / `idt info`
    keyboard: gboard

autopilot:
  enabled: false
  decisions: {}             # see autopilot.md; a missing key means "ask"
